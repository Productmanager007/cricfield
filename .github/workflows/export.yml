# Produce web-data/ from the committed model.
#
# CI is the CANONICAL export path, not a workaround for a blocked laptop.
# The reason is provenance. This job runs on a clean checkout of a pushed
# commit, so git rev-parse returns exactly the commit the code came from and
# git status is empty: meta.json records git_commit accurately, git_dirty
# false, and git_dirty_known true. A local export cannot promise any of that
# -- it runs against whatever is in the working tree, which is usually dirty
# during development, and on a machine where git may not be on PATH at all
# (in which case the exporter falls back to reading .git and can no longer
# determine the dirty state). See architecture.md section 14.
#
# A local run remains useful for development. It is not the thing you publish.

name: export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cricfield/**"
      - "scripts/export_web.py"
      - "requirements.txt"

# One export at a time. A superseded run has nothing to contribute.
concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download the Cricsheet IPL bundle
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-delay 5 \
            -o ipl_json.zip https://cricsheet.org/downloads/ipl_json.zip
          ls -l ipl_json.zip

      - name: Verify the bundle is a real zip
        run: |
          set -euo pipefail
          # curl -f already rejects HTTP errors, but an error page or a
          # captive proxy can arrive with a 200 and the wrong body. Check what
          # actually landed rather than trusting the status code.
          if [ "$(head -c 4 ipl_json.zip | xxd -p)" != "504b0304" ]; then
            echo "::error::ipl_json.zip does not begin with the PK zip magic number."
            echo "First 200 bytes of what was actually downloaded:"
            head -c 200 ipl_json.zip || true
            exit 1
          fi
          if ! unzip -t ipl_json.zip > /dev/null; then
            echo "::error::ipl_json.zip failed the zip integrity test; it is truncated or corrupt."
            exit 1
          fi
          n="$(unzip -Z1 ipl_json.zip | grep -c '\.json$' || true)"
          echo "JSON entries in bundle: $n"
          # A deliberately loose floor. The bundle held 1,243 matches when this
          # was written and grows each season, so this catches an error page or
          # a truncated download without breaking when Cricsheet changes.
          if [ "$n" -lt 500 ]; then
            echo "::error::only $n JSON entries; expected well over 1,000. Bundle looks wrong."
            exit 1
          fi

      - name: Export
        # scripts/export_web.py reconciles per-season FRAA against the career
        # table and returns 1 when they disagree (see the recon block and the
        # final `return 1 if len(bad) else 0`), so a broken export fails this
        # step rather than producing quietly wrong JSON.
        run: python scripts/export_web.py --data ipl_json.zip --min-balls 900

      - name: Show recorded provenance
        run: |
          jq '{generated_at, git_commit, git_dirty, git_dirty_known, git_source,
               matches, deliveries, qualified_fielders, player_seasons,
               reconciled_players}' web-data/meta.json

      - name: Upload web-data
        # Deliberately NOT `if: always()`. The reconciliation check runs before
        # the files are written, so a failed export still leaves web-data/ on
        # disk. Uploading it regardless would publish an artefact that the job
        # had already judged wrong.
        uses: actions/upload-artifact@v4
        with:
          name: web-data
          path: web-data/
          if-no-files-found: error
